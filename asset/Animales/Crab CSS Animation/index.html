<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crab CSS Animation</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <h1 style="font-family: monospace; margin: 15px 0 ;">Juega cuando estes...</h1>

      <button class="btn cube cube-hover" type="button" >
        <div class="bg-top">
          <div class="bg-inner"></div>
        </div>
        <div class="bg-right">
          <div class="bg-inner"></div>
        </div>
        <div class="bg">
          <div class="bg-inner"></div>
        </div>
        <a href="../../Juegos/TIC-TOC-TOE-main/index.html" class="text">Conmigo</a>
      </button>


      <div class="crab">
        <div class="hand">
          <div class="claw-1-l"></div>
          <div class="claw-1-r"></div>
          <div class="claw-2-l"></div>
          <div class="claw-2-r"></div>
        </div>
        <div class="mouth"></div>
        <div class="legs-1"></div>
        <div class="legs-2"></div>
        <div class="eyes"></div>
        
      </div>

      

      <button class="btn cube cube-hover" type="button">
        <div class="bg-top">
          <div class="bg-inner"></div>
        </div>
        <div class="bg-right">
          <div class="bg-inner"></div>
        </div>
        <div class="bg">
          <div class="bg-inner"></div>
        </div>
        <a href="../../Juegos/Memory Game/index.html" class="text">Sin Mi</a>
      </button>



    </div>


  
  </body>
</html>
